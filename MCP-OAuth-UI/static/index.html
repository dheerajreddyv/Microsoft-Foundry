<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP OAuth Agent</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }
        .header { background: #0078d4; color: white; padding: 16px 24px; font-size: 18px; font-weight: 600; }
        .chat-container { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 75%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; word-wrap: break-word; }
        .message.user { align-self: flex-end; background: #0078d4; color: white; }
        .message.assistant { align-self: flex-start; background: white; border: 1px solid #e0e0e0; }
        .message.system { align-self: center; background: #fff3cd; border: 1px solid #ffc107; font-size: 14px; text-align: center; }
        .consent-banner { background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px; padding: 16px; margin: 8px 0; text-align: center; }
        .consent-banner a { display: inline-block; margin-top: 8px; padding: 10px 20px; background: #0078d4; color: white; text-decoration: none; border-radius: 6px; font-weight: 500; }
        .consent-banner a:hover { background: #005a9e; }
        .consent-banner button { margin-top: 12px; padding: 8px 16px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .consent-banner button:hover { background: #218838; }
        .input-area { padding: 16px 24px; background: white; border-top: 1px solid #e0e0e0; display: flex; gap: 12px; }
        .input-area input { flex: 1; padding: 12px 16px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; outline: none; }
        .input-area input:focus { border-color: #0078d4; }
        .input-area button { padding: 12px 24px; background: #0078d4; color: white; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
        .input-area button:hover { background: #005a9e; }
        .input-area button:disabled { background: #ccc; cursor: not-allowed; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #ccc; border-top-color: #0078d4; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="header">MCP OAuth Agent Chat</div>
    <div class="chat-container" id="chat"></div>
    <div class="input-area">
        <input type="text" id="input" placeholder="Ask the agent something..." autofocus />
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>

    <script>
        let conversationId = null;
        let isWaitingForConsent = false;

        const chatEl = document.getElementById('chat');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');

        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !sendBtn.disabled) sendMessage();
        });

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerHTML = text;
            chatEl.appendChild(div);
            chatEl.scrollTop = chatEl.scrollHeight;
            return div;
        }

        function showConsentBanner(links) {
            const container = document.createElement('div');
            container.className = 'consent-banner';
            container.innerHTML = `
                <strong>🔐 OAuth Consent Required</strong><br>
                <p style="margin-top:8px">The MCP server needs your authorization. Click below to grant access:</p>
                ${links.map(l => `<a href="${l.consent_link}" target="_blank">Authorize ${l.server_label}</a>`).join('<br>')}
                <br><button onclick="resumeAfterConsent(this)">I've completed consent — Continue</button>
            `;
            chatEl.appendChild(container);
            chatEl.scrollTop = chatEl.scrollHeight;
        }

        async function sendMessage() {
            const msg = inputEl.value.trim();
            if (!msg) return;

            inputEl.value = '';
            addMessage(msg, 'user');
            setLoading(true);

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg }),
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.detail || 'API error');

                conversationId = data.conversation_id;

                if (data.status === 'consent_required') {
                    isWaitingForConsent = true;
                    showConsentBanner(data.consent_links);
                    setLoading(false);
                } else {
                    addMessage(data.answer || '(no response)', 'assistant');
                    setLoading(false);
                }
            } catch (err) {
                addMessage(`Error: ${err.message}`, 'system');
                setLoading(false);
            }
        }

        async function resumeAfterConsent(btn) {
            btn.disabled = true;
            btn.textContent = 'Resuming...';
            setLoading(true);

            try {
                const res = await fetch('/api/chat/resume', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ conversation_id: conversationId }),
                });
                const data = await res.json();

                if (!res.ok) throw new Error(data.detail || 'API error');

                conversationId = data.conversation_id;

                if (data.status === 'consent_required') {
                    showConsentBanner(data.consent_links);
                } else {
                    isWaitingForConsent = false;
                    addMessage(data.answer || '(no response)', 'assistant');
                }
            } catch (err) {
                addMessage(`Error: ${err.message}`, 'system');
            }
            setLoading(false);
        }

        function setLoading(loading) {
            sendBtn.disabled = loading;
            if (loading) {
                const existing = document.querySelector('.loading-msg');
                if (!existing) {
                    const div = addMessage('<span class="spinner"></span> Agent is thinking...', 'system');
                    div.classList.add('loading-msg');
                }
            } else {
                const el = document.querySelector('.loading-msg');
                if (el) el.remove();
            }
        }
    </script>
</body>
</html>
